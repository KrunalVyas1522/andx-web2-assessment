version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: andx
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d andx"]
      interval: 5s
      timeout: 5s
      retries: 5
  broker:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      REDIS_URL: redis://broker:6379
    depends_on:
      broker:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
  aggregator:
    build: ./aggregator
    environment:
      REDIS_URL: redis://broker:6379
      DATABASE_URL: postgres://user:password@postgres:5432/andx
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
  earnings:
    build: ./earnings
    environment:
      REDIS_URL: redis://broker:6379
      DATABASE_URL: postgres://user:password@postgres:5432/andx
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: ./api
    ports:
      - "${API_PORT:-8081}:8081"
    environment:
      REDIS_URL: redis://broker:6379
      DATABASE_URL: postgres://user:password@postgres:5432/andx
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
  classifier:
    build: ./classifier
    environment:
      REDIS_URL: redis://broker:6379
      DATABASE_URL: postgres://user:password@postgres:5432/andx
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1.5G
