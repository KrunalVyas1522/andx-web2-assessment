version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: andx
    ports:
      - "5432:5432"
  broker:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      REDIS_URL: redis://broker:6379
    depends_on:
      - broker
  aggregator:
    build: ./aggregator
    environment:
      REDIS_URL: redis://broker:6379
      DATABASE_URL: postgres://user:password@postgres:5432/andx
    depends_on:
      - broker
      - postgres
  earnings:
    build: ./earnings
    environment:
      REDIS_URL: redis://broker:6379
      DATABASE_URL: postgres://user:password@postgres:5432/andx
    depends_on:
      - broker
      - postgres
  api:
    build: ./api
    ports:
      - "${API_PORT:-8081}:8081"
    environment:
      REDIS_URL: redis://broker:6379
      DATABASE_URL: postgres://user:password@postgres:5432/andx
    depends_on:
      - broker
      - postgres
  classifier:
    build: ./classifier
    environment:
      REDIS_URL: redis://broker:6379
      DATABASE_URL: postgres://user:password@postgres:5432/andx
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      - broker
      - postgres
